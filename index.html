<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121416" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="雾港来信：一款关于陪伴、选择与潮声的原创互动故事。" />
    <meta name="app-version" content="0.3.0" />
    <title>雾港来信 · 雾港档案</title>
    <link rel="stylesheet" href="src/ui/styles.css?v=0.3.0" />
    <link rel="stylesheet" href="src/ui/companion.css?v=0.3.0" />
    <script type="module" src="src/app/main.js?v=0.3.0"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="rail" aria-label="主导航">
        <a class="brand-mark" href="#home" data-route="home" aria-label="雾港来信首页">M<span>·</span></a>
        <div class="rail-links">
          <button class="rail-button active" data-route="home" aria-label="陪伴" title="陪伴"><span class="icon">⌂</span></button>
          <button class="rail-button" data-route="messages" aria-label="通讯" title="通讯"><span class="icon">✉</span><i class="unread-dot"></i></button>
          <button class="rail-button" data-route="story" aria-label="档案" title="档案"><span class="icon">▤</span></button>
          <button class="rail-button" data-route="profile" aria-label="角色档案" title="角色档案"><span class="icon">◉</span></button>
        </div>
        <div class="rail-bottom"><span class="rail-date">v0.3.0</span><span class="live-indicator"></span></div>
      </aside>
      <main id="app" class="main-view" tabindex="-1"></main>
      <nav class="mobile-nav" aria-label="主导航">
        <button class="mobile-tab active" data-route="home"><span>⌂</span><small>陪伴</small></button>
        <button class="mobile-tab" data-route="messages"><span>✉</span><small>通讯</small><i class="unread-dot"></i></button>
        <button class="mobile-tab" data-route="story"><span>▤</span><small>档案</small></button>
        <button class="mobile-tab" data-route="profile"><span>◉</span><small>角色</small></button>
      </nav>
      <div id="toast-region" class="toast-region" aria-live="polite"></div>
    </div>
  </body>
</html>
